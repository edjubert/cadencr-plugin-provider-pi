[package]
name = "cadencr-plugin-provider-pi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cadencr code-backed provider connector for the Pi coding agent"
repository = "https://github.com/edjubert/cadencr-plugin-provider-pi"
publish = false

[dependencies]
agent-client-protocol = "1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true
lto = true
